<div id="ui">

<label><input type="checkbox" id="fast"> show fasteners</label>
<label><input type="checkbox" id="cab"> show cables</label>
<label><input type="checkbox" id="wire"> wireframe</label>

<label><input type="checkbox" id="pstd" checked> show standing person (172 cm) beside</label>

<button id="iso">Isolate selected sub</button><button id="all">Show all</button>
<h3>Totals</h3><div id="tot"></div>
</div><div id="info">Click a part.</div><div id="tip"></div>
